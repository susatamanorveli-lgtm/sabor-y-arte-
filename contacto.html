<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Restaurante Sabor & Arte</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Sabor & Arte</h1>
            <nav>
                <ul id="nav-menu">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="proyectos.html">Nuestros Platos</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2>Haz tu reserva o contáctanos</h2>
        <div class="formulario-contenedor">
            <form id="form-contacto">
                <div class="grupo-input">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej: María Pérez">
                </div>
                
                <div class="grupo-input">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="maria@ejemplo.com">
                </div>
                
                <div class="grupo-input">
                    <label for="mensaje">Mensaje o detalles de la reserva</label>
                    <textarea id="mensaje" name="mensaje" rows="5" required placeholder="Me gustaría reservar una mesa para 4 personas..."></textarea>
                </div>
                
                <button type="submit" class="btn btn-block">Enviar Mensaje</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Restaurante Sabor & Arte. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
